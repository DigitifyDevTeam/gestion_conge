<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>{% block title %}Gestion de congé{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4f6f9;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;">
          <!-- Header -->
          <tr>
            <td bgcolor="#6366f1" style="background-color:#6366f1;background-image:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);border-radius:16px 16px 0 0;padding:32px 40px;text-align:center;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td align="center">
                    <div style="display:inline-block;width:48px;height:48px;background-color:#818cf8;border-radius:12px;line-height:48px;font-size:24px;margin-bottom:12px;">🌴</div>
                    <h1 style="margin:0;color:#ffffff;font-size:24px;font-weight:700;letter-spacing:-0.5px;">{% block header_title %}Gestion de congé{% endblock %}</h1>
                    <p style="margin:8px 0 0;color:#e0e7ff;font-size:14px;">{% block header_subtitle %}Gestion des congés{% endblock %}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="background-color:#ffffff;padding:40px;border-left:1px solid #e5e7eb;border-right:1px solid #e5e7eb;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background-color:#f9fafb;border-radius:0 0 16px 16px;padding:24px 40px;border:1px solid #e5e7eb;border-top:none;text-align:center;">
              <p style="margin:0 0 8px;color:#9ca3af;font-size:12px;line-height:1.5;">
                Cet e-mail a été envoyé automatiquement par Gestion de congé.
              </p>
              <p style="margin:0;color:#9ca3af;font-size:12px;">
                {% block footer_extra %}{% endblock %}
                &copy; {{ year }} Gestion de congé
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
