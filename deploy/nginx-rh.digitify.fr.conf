# Virtualmin web UI (no SSH sudo needed):
# rh.digitify.fr → Server Configuration → Nginx Directives
# Paste the location blocks below.

# React SPA — required so /activate, /users, /requests are not nginx 404s
index index.html;
location / {
    try_files $uri $uri/ /index.html;
}

# Django API — frontend calls /api (see react/src/api/client.ts)
# Port 8001: port 8000 is used by another service on this VPS
location /api/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Large HR documents / leave attachments (max 10 Mo)
    client_max_body_size 12m;
    proxy_redirect off;
}

# Optional: public media for leave-request attachments only.
# Employee HR documents are served via authenticated /api/employee-documents/*/download/
# and do NOT need this block. Adjust the alias path to your deploy root.
