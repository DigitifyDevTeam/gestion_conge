# Virtualmin → rh.digitify.fr → Server Configuration → Nginx Directives
# Paste the location blocks below (adjust root if your public_html path differs).

# React SPA — handle client-side routes (/login, /dashboard, …)
location / {
    try_files $uri $uri/ /index.html;
}

# Django API — frontend calls /api (see react/src/api/client.ts)
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}
